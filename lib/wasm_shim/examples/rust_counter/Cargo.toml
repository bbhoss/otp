[package]
name = "rust_counter"
version = "0.1.0"
edition = "2021"
description = "Example gen_wasmserver implementation in Rust"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
# No external dependencies - we implement ETF encoding ourselves

[profile.release]
opt-level = "s"        # Optimize for size
lto = true             # Link-time optimization
codegen-units = 1      # Better optimization
panic = "abort"        # No unwinding needed in WASM
strip = true           # Strip symbols
